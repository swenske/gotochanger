# Manual, versioned release: builds gotochangerd/gotochanger-changer/
# gotochangerctl/gotochanger-tcmud, packages them into the gotochanger and
# gotochanger-kernel .deb packages (see .goreleaser.yaml), creates a GitHub
# Release with a commit-based changelog, and pushes both .debs into the
# internal aptly mirror at apt.int.sw-servers.net.
#
# Manual-only, on purpose: this runs on the self-hosted runner (needs its
# persistent Go/gcc/dpkg toolchain and its dedicated aptly-publish SSH key),
# which must never be reachable from a pull_request trigger.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version part to bump from the latest vX.Y.Z tag"
        type: choice
        options: [patch, minor, major]
        default: patch

# Never let two releases run at once - both mutate tags and the same
# aptly repo.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # to create the version tag and the GitHub Release
  pull-requests: write # to open/merge the debian/changelog update PR below

jobs:
  release:
    # This project's own self-hosted runner - has the persistent Go/gcc/
    # dpkg-dev/debhelper/fakeroot toolchain (installed once, not
    # per-job like a GitHub-hosted runner) and the dedicated,
    # forced-command-restricted SSH key used below to reach the aptly
    # server. Never used for pull_request-triggered jobs (see ci.yml).
    runs-on: [self-hosted, docker, aptly]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full tag history, needed for both version-bump and changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Computes the next vX.Y.Z tag from the highest existing "v*" tag,
      # bumped per the chosen bump_type input. First-ever release (no tag
      # yet) is v0.7.0, continuing from debian/changelog's own version
      # history (0.6.2) rather than restarting at v0.1.0/v0.0.0.
      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"

          if [ -z "$latest" ]; then
            new_version="v0.7.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            case "${{ inputs.bump_type }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new_version="v${major}.${minor}.${patch}"
          fi

          echo "Previous tag: ${latest:-<none>}"
          echo "New version:  $new_version"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest" >> "$GITHUB_OUTPUT"

      # debian/changelog is otherwise untouched by this pipeline (see
      # .goreleaser.yaml's own changelog, generated independently from
      # commits) - but it's also this project's single source of truth
      # for the version dpkg-buildpackage/scripts/redeploy.sh embed in a
      # locally-built package, so it needs to track every tagged release
      # too. Adds one new entry, mechanically generated from every commit
      # since the previous tag (matching goreleaser's own changelog
      # range), never rewriting history.
      #
      # A direct push to main was tried first and confirmed (on a real
      # release attempt) to fail: main's branch protection requires the 3
      # CI checks to have passed for a commit before it can land there,
      # and only the repo owner's own account has a bypass for that -
      # github-actions[bot] does not. So instead: push the change to a
      # throwaway branch, open a PR, wait for its checks, then merge it
      # via the API - the tag is created afterward, against the resulting
      # main tip, so the tagged tree still ends up containing this entry.
      #
      # Opening the PR needs a real token (the RELEASE_PAT secret, a
      # fine-grained PAT), not the default GITHUB_TOKEN - GitHub
      # deliberately does not trigger other workflows (like ci.yml's
      # pull_request checks) for events created by GITHUB_TOKEN itself,
      # to prevent recursive workflow runs. Everything after the PR is
      # opened (reading check-run status, merging, deleting the branch)
      # uses the ordinary GITHUB_TOKEN.
      - name: Update debian/changelog via PR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ver="${VERSION#v}"
          range="${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD"
          branch="chore/changelog-$ver"

          {
            printf 'gotochanger (%s) UNRELEASED; urgency=medium\n\n' "$ver"
            git log --reverse --no-merges --pretty=format:'  * %s' "$range"
            printf '\n\n -- github-actions[bot] <github-actions[bot]@users.noreply.github.com>  %s\n\n' "$(date -u -R)"
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog

          git checkout -b "$branch"
          git add debian/changelog
          git commit -m "debian/changelog: add $ver entry"
          # A plain new-branch push, not to the protected "main" ref, so
          # the default GITHUB_TOKEN is sufficient here. --force so a
          # retry after a previous failed run doesn't trip over a
          # same-named leftover branch.
          git push --force origin "$branch"

          pr_number="$(curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls" \
            -d "$(jq -n --arg title "debian/changelog: add $ver entry" \
                        --arg head "$branch" --arg base "main" \
                        --arg body "Automated changelog entry for release $VERSION." \
                  '{title:$title, head:$head, base:$base, body:$body}')" \
            | jq -r '.number')"
          echo "Opened PR #$pr_number ($branch -> main)"

          head_sha="$(git rev-parse HEAD)"
          # Only these are actually required by main's branch protection
          # (ci.yml's own job names) - opening this PR also triggers
          # claude-review.yml's own "review" check on the same commit,
          # which is advisory only and must never gate a release (found
          # the hard way: a real release attempt hung/failed here because
          # a flaky Claude review run was treated as required).
          required_names='["lint","test","build"]'
          echo "Waiting for required checks ($required_names) on $head_sha..."
          checks="{}"
          present_count=0
          for _ in $(seq 1 60); do
            checks="$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs")"
            present="$(echo "$checks" | jq --argjson names "$required_names" \
              '[.check_runs[] | select(.name as $n | $names | index($n) != null)]')"
            present_count="$(echo "$present" | jq 'length')"
            incomplete="$(echo "$present" | jq '[.[] | select(.status != "completed")] | length')"
            if [ "$present_count" -ge 3 ] && [ "$incomplete" = "0" ]; then
              break
            fi
            sleep 10
          done

          failed="$(echo "$checks" | jq --argjson names "$required_names" \
            '[.check_runs[] | select(.name as $n | $names | index($n) != null) | select(.conclusion != "success")] | length')"
          if [ "$present_count" -lt 3 ] || [ "$failed" != "0" ]; then
            echo "required checks (lint/test/build) did not all complete successfully, aborting release:" >&2
            echo "$checks" | jq --argjson names "$required_names" -r \
              '.check_runs[] | select(.name as $n | $names | index($n) != null) | "\(.name): \(.status)/\(.conclusion)"' >&2
            exit 1
          fi

          curl -sf -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" \
            -d '{"merge_method":"squash"}'

          curl -sf -X DELETE \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"

          # Sync the local checkout to the just-merged main tip, so the
          # tag created next actually includes this changelog entry.
          # "-B" (not a plain checkout) since it's not guaranteed main
          # already exists as a real local branch at this point.
          git fetch origin main
          git checkout -B main origin/main

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # goreleaser's "dockers:" section shells out to a plain "docker
      # build"/"docker push" and does not authenticate itself - the
      # runner's docker CLI must already be logged in before that step
      # runs. DOCKERHUB_TOKEN should be a Docker Hub access token scoped
      # to this one repository (swenske/gotochanger), not an
      # account-wide password/token - and needs Read/Write/Delete scope,
      # not just Read/Write, since the "Sync README to Docker Hub" step
      # below reuses the same token and peter-evans/dockerhub-description
      # requires Delete scope to update the repository description.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds all four binaries, packages the two .debs, builds and
      # pushes the swenske/gotochanger Docker image, generates the
      # changelog (every commit since the previous tag), and creates the
      # GitHub Release with binaries + .debs + checksums as assets. See
      # .goreleaser.yaml for the full build/package/image definition.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: -mod=vendor

      # Keeps swenske/gotochanger's Docker Hub "Overview" tab in sync with
      # docker/gotochanger/README.md, a dedicated file rather than this
      # repo's root README.md: Docker Hub caps descriptions at 25000 bytes
      # and silently truncates anything longer (the full README already
      # exceeds that), and content that only works in GitHub's rendering
      # context - repo-relative image/file links - breaks on Docker Hub,
      # which has no base path to resolve them against.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: swenske/gotochanger
          readme-filepath: docker/gotochanger/README.md

      # Pushes both .debs into the internal aptly mirror using the
      # restricted, forced-command SSH access set up on apt.int.sw-servers.net
      # (see /usr/local/sbin/gotochanger-publish-dispatch.sh and
      # /usr/local/sbin/gotochanger-aptly-publish.sh on that host). The
      # private key lives only on this runner
      # (~/.ssh/id_gotochanger_aptly, generated locally, never uploaded) -
      # deliberately not a GitHub secret, so trust stays local between
      # these two machines.
      - name: Publish .deb packages to the internal apt repository
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          KEY="$HOME/.ssh/id_gotochanger_aptly"
          HOST="gotochanger-publish@apt.int.sw-servers.net"
          VER="${VERSION#v}"

          for name in "gotochanger_${VER}_amd64.deb" "gotochanger-kernel_${VER}_amd64.deb"; do
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$KEY" "$HOST" \
              "upload $name" < "dist/$name"
          done
          ssh -o BatchMode=yes -i "$KEY" "$HOST" "publish"
