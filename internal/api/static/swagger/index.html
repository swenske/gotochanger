<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>gotochanger API docs</title>
  <link rel="stylesheet" href="/assets/swagger/swagger-ui.css">
  <link rel="stylesheet" href="/assets/swagger/gotochanger-swagger.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="/assets/swagger/swagger-ui-bundle.js"></script>
<script src="/assets/swagger/swagger-ui-standalone-preset.js"></script>
<script>
  window.onload = function () {
    window.ui = SwaggerUIBundle({
      url: "/api/v1/openapi.json",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout",
      persistAuthorization: true,
    });
  };
</script>
</body>
</html>
